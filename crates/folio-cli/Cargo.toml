[package]
name = "folio-cli"
description = "folio from the terminal: every registry command, on the running app or on a .folio file"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "folio_cli"
path = "src/lib.rs"

[[bin]]
name = "folio-cli"
path = "src/main.rs"

[dependencies]
folio-control.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
folio-core.workspace = true
tempfile.workspace = true
