[package]
name = "folio"
description = "folio — documents, sheets and slides in one file"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "folio"
path = "src/main.rs"

[dependencies]
folio-calc.workspace = true
folio-core.workspace = true
folio-layout.workspace = true
folio-io.workspace = true
folio-control.workspace = true
folio-agent.workspace = true

anyhow = "1"
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
uuid.workspace = true
image.workspace = true
rust-embed = { version = "8", features = ["include-exclude"] }
unicode-segmentation.workspace = true
smallvec = "1"

gpui = { git = "https://github.com/zed-industries/zed", rev = "7733b9922665f103abda7c6a3fde6b9dfdc8eba9", default-features = false }
gpui_tokio = { git = "https://github.com/zed-industries/zed", rev = "7733b9922665f103abda7c6a3fde6b9dfdc8eba9" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "7733b9922665f103abda7c6a3fde6b9dfdc8eba9", default-features = false, features = ["test-support"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7733b9922665f103abda7c6a3fde6b9dfdc8eba9", features = ["font-kit", "runtime_shaders"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7733b9922665f103abda7c6a3fde6b9dfdc8eba9", features = ["wayland", "x11"] }
# gpui picks X11 or Wayland from its own features (`guess_compositor`); without them the Linux
# app runs headless, with no window.
gpui = { git = "https://github.com/zed-industries/zed", rev = "7733b9922665f103abda7c6a3fde6b9dfdc8eba9", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7733b9922665f103abda7c6a3fde6b9dfdc8eba9" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
