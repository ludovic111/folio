name: Release

# Builds folio for Linux and macOS (Apple Silicon and Intel) with the scripts in scripts/ and
# attaches everything to a draft GitHub release. Windows is coming soon (its script and matrix entry
# stay, commented out below). The macOS builds run on the Mac mini (a self-hosted runner;
# MAC_RUNNER=macos-latest sends them back to GitHub). The draft is never published here:
# `scripts/publish-build.sh <version>` copies it to ludovic111/lsuite-builds (lsuite's
# DISTRIBUTION.md), where the lsuite app and folio's updater get it, and deletes the draft.
#
# Asset names are stable (no version): folio-linux-x86_64.AppImage, folio-linux-x86_64.deb,
# folio-macos-{arm64,x86_64}.dmg and .app.tar.gz (plus SHA256SUMS); later folio-windows-x86_64.exe
# and .zip.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os == 'mac' && (vars.MAC_RUNNER || 'ludovics-mac-mini') || matrix.os }}
    timeout-minutes: 90
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_API_KEY_P8_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS builds on the Mac mini (Apple Silicon); the Intel one is cross-compiled.
          - { name: macOS (Apple Silicon), os: mac, target: aarch64-apple-darwin, script: bundle-macos.sh }
          - { name: macOS (Intel), os: mac, target: x86_64-apple-darwin, script: bundle-macos.sh }
          # Coming soon:
          # - { name: Windows, os: windows-latest, target: x86_64-pc-windows-msvc, script: bundle-windows.sh }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, script: bundle-linux.sh }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # On the Mac mini, keep target/ between runs (incremental builds).
          clean: ${{ runner.environment == 'github-hosted' }}

      # A self-hosted runner keeps target/ between jobs: no other target's packages may be uploaded.
      - name: Empty target/dist
        run: rm -rf target/dist

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the workspace version $version in Cargo.toml." >&2
            exit 1
          fi

      # GPUI's Linux backends (X11 + Wayland, Vulkan, fontconfig) and the keychain (D-Bus);
      # see script/linux in the zed repository.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libasound2-dev libdbus-1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libzstd-dev libglib2.0-dev desktop-file-utils

      - name: NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          if ! command -v makensis > /dev/null && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          key: ${{ matrix.target }}

      # Developer ID signing and notarization on macOS, with the same secrets as ryolune and kimchi
      # (APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      # APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER). Without them the build is
      # ad-hoc signed.
      - name: Apple signing and notarization (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/prepare-apple-signing.sh

      - name: Require release credentials
        env:
          UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$UPDATE_KEY"
          if [ "$RUNNER_OS" = macOS ]; then test "$HAS_APPLE_SIGNING" = true; fi

      - name: Build and package
        run: bash scripts/${{ matrix.script }} ${{ runner.os == 'macOS' && matrix.target || '' }}

      - name: Sign and verify updater archives
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          cargo build --release --locked -p folio-release
          for file in target/dist/*.app.tar.gz target/dist/*.exe target/dist/*.zip target/dist/*.AppImage target/dist/*.deb; do
            [ -f "$file" ] || continue
            target/release/folio-release sign "$file" --version "$version"
            target/release/folio-release verify "$file" --version "$version"
          done

      # The Mac mini runs as its owner's account: delete the throwaway keychain and put the user's
      # keychain search list back exactly as prepare-apple-signing.sh found it.
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db"; fi
          if [ -f "$RUNNER_TEMP/keychains-before" ]; then
            keychains=()
            while IFS= read -r k; do [ -n "$k" ] && keychains+=("$k"); done < "$RUNNER_TEMP/keychains-before"
            security list-keychains -d user -s ${keychains[@]+"${keychains[@]}"}
            rm -f "$RUNNER_TEMP/keychains-before"
          fi
          rm -f "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.target }}
          path: |
            target/dist/folio-macos-*.dmg
            target/dist/folio-macos-*.app.tar.gz
            target/dist/folio-windows-*.exe
            target/dist/folio-windows-*.zip
            target/dist/folio-linux-*.AppImage
            target/dist/folio-linux-*.deb
            target/dist/*.sig
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Notes and checksums
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # What changed: CHANGELOG.md's section for this version, when there is one.
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          fi
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "folio $version: documents, sheets and slides in one file." > "$RUNNER_TEMP/notes.md"
          fi
          cat >> "$RUNNER_TEMP/notes.md" <<'NOTES'

          ### Download
          folio is in beta for Linux and macOS, through the lsuite app: `folio-linux-x86_64.AppImage` or
          `folio-linux-x86_64.deb`; `folio-macos-arm64.dmg` (Apple Silicon) or `folio-macos-x86_64.dmg`
          (Intel). Windows is coming soon.
          NOTES
          (cd dist && sha256sum folio-* > SHA256SUMS)
          ls -l dist

      - uses: dtolnay/rust-toolchain@stable
      - name: Verify and create updater manifest
        run: cargo run --release --locked -p folio-release -- manifest dist --version "$VERSION" --base-url "https://github.com/ludovic111/folio/releases/download/v$VERSION" --out dist/latest.json

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft -q .isDraft)" != true ]; then
              echo "Release $tag is already published; not replacing its files." >&2
              exit 1
            fi
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --draft --target "$GITHUB_SHA" --title "folio $tag" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
